logDir=.
# We are not using NDC anywhere so %x has been omitted for the time being
# %d = date
# %r = ms since start
# %t = thread name
# %p = debug level
# %c = class name
# %m = message
# %n = newline

# Set root logger level to DEBUG with two appenders: SUCCESS and ERROR
log4j.rootLogger=DEBUG, SUCCESS, ERROR

# SUCCESS appender - logs INFO and DEBUG messages to success log file
#log4j.appender.SUCCESS=org.apache.log4j.ConsoleAppender
log4j.appender.SUCCESS=org.apache.log4j.RollingFileAppender
log4j.appender.SUCCESS.File=${logDir}/dittoe-engine.log
log4j.appender.SUCCESS.append=true
log4j.appender.SUCCESS.MaxBackupIndex=2000
log4j.appender.SUCCESS.maxFileSize=1GB
log4j.appender.SUCCESS.layout=org.apache.log4j.PatternLayout
log4j.appender.SUCCESS.layout.ConversionPattern=[%d{dd MMM yyyy HH:mm:ss.SSS} - %rms] [%t] [%p] [%c:%L]: %m%n
# Filter to accept only INFO and DEBUG levels
log4j.appender.SUCCESS.filter.1=org.apache.log4j.varia.LevelRangeFilter
log4j.appender.SUCCESS.filter.1.LevelMin=DEBUG
log4j.appender.SUCCESS.filter.1.LevelMax=INFO
log4j.appender.SUCCESS.filter.1.AcceptOnMatch=true
log4j.appender.SUCCESS.filter.2=org.apache.log4j.varia.DenyAllFilter

# ERROR appender - logs WARN and ERROR messages to error log file
#log4j.appender.ERROR=org.apache.log4j.ConsoleAppender
log4j.appender.ERROR=org.apache.log4j.RollingFileAppender
log4j.appender.ERROR.File=${logDir}/dittoe-engine.error.log
log4j.appender.ERROR.append=true
log4j.appender.ERROR.MaxBackupIndex=2000
log4j.appender.ERROR.maxFileSize=1GB
log4j.appender.ERROR.layout=org.apache.log4j.PatternLayout
log4j.appender.ERROR.layout.ConversionPattern=[%d{dd MMM yyyy HH:mm:ss.SSS} - %rms] [%t] [%p] [%c:%L]: %m%n
# Filter to accept only WARN and ERROR levels
log4j.appender.ERROR.filter.1=org.apache.log4j.varia.LevelRangeFilter
log4j.appender.ERROR.filter.1.LevelMin=WARN
log4j.appender.ERROR.filter.1.LevelMax=FATAL
log4j.appender.ERROR.filter.1.AcceptOnMatch=true
log4j.appender.ERROR.filter.2=org.apache.log4j.varia.DenyAllFilter

# Suppress DEBUG messages from HikariCP
log4j.logger.com.zaxxer.hikari=INFO
# Suppress DEBUG messages from Snowflake
log4j.logger.net.snowflake.client=INFO
log4j.logger.io.grpc.netty=INFO
log4j.logger.software.amazon.awssdk=INFO
log4j.logger.org.apache.http=INFO
